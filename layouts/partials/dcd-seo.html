<meta property="og:type" content="website">
<meta property="og:site_name" content="DCD Advisory">
<meta property="og:title" content="{{ .title }}">
<meta property="og:description" content="{{ .description }}">
<meta property="og:url" content="{{ .url }}">
<meta property="og:image" content="https://dcdadvisory.com/images/dcd-advisory-social-share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="DCD Advisory — We Build What Happens Next">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ .title }}">
<meta name="twitter:description" content="{{ .description }}">
<meta name="twitter:image" content="https://dcdadvisory.com/images/dcd-advisory-social-share.png">
<meta name="twitter:image:alt" content="DCD Advisory — We Build What Happens Next">
{{ with .canonical }}
<link rel="canonical" href="{{ . }}">
{{ end }}
